{% if not day.meals.all %}
<div class="day-{{ day.date.isoformat }}" style="position: absolute; inset: 0; padding: 0.5rem;"
  hx-get="{% url 'planner:edit_day' date=day.date.isoformat %}" hx-trigger="click"
  hx-target="td.day-{{ day.date.isoformat }}">
</div>
{% else %}
{% for meal in day.meals.all %}
{% if meal.is_recipe %}
<a class="text-primary" href="#" data-bs-toggle="modal" data-bs-target="#mealModal"
  hx-get="{% url 'planner:showmeal' pk=meal.pk%}" hx-target=".modal-dialog">{{ meal.name }}</a>
{% else %}
<a class="text-danger" href="#" data-bs-toggle="modal" data-bs-target="#mealModal"
  hx-get="{% url 'planner:editmeal' pk=meal.pk%}" hx-target=".modal-dialog">{{ meal.name }}</a>
{% endif %}
{% endfor %}
{% endif %}
